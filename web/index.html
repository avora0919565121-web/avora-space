<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>AVORA</title>
    <meta name="description" content="Avora Space — Clarity - Inner Space - My Space. Trò chuyện, suy nghĩ và quản trị việc cần làm — ở cùng một nơi của riêng bạn." />

    <meta property="og:title" content="AVORA" />
    <meta property="og:description" content="Avora Space — Clarity - Inner Space - My Space. Trò chuyện, suy nghĩ và quản trị việc cần làm — ở cùng một nơi của riêng bạn." />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300..700;1,400&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" href="/favicon.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F6F3EC" />

    <!-- iOS Safari ignores most of the manifest, so the home-screen app is described here too. -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AVORA" />

    <!-- AVORA-74 · 74.6: paint the look saved on this device before the first frame (no orange flash). -->
    <script>
      (function () {
        try {
          var raw = JSON.parse(localStorage.getItem("avora.look") || "null");
          var scheme = raw && raw.scheme ? raw.scheme : "device";
          var dark = scheme === "dark" || (scheme === "device" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (dark) root.classList.add("dark");
          root.style.colorScheme = dark ? "dark" : "light";
          var vars = raw && (dark ? raw.dark : raw.light);
          if (vars) for (var k in vars) if (/^--[a-z-]+$/.test(k)) root.style.setProperty(k, String(vars[k]));
          if (raw && raw.tone) root.setAttribute("data-tone", String(raw.tone));
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#191715" : "#F6F3EC");
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
